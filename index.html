<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UCO Data Science Hub</title>
<meta name="description" content="Outils de révision et de pratique pour les étudiants du Bachelor Business Data Science de l'UCO Angers.">
<meta name="theme-color" content="#0E7470">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231B2A41'/%3E%3Cpath d='M4 25 C10 25 11 7 16 7 S22 25 28 25' fill='none' stroke='%23F2D94E' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&family=Schibsted+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>
:root{
  --ink:#1B2A41; --ink-2:#44536B; --ink-3:#6B7890;
  --paper:#F4F6F5; --sheet:#FFFFFF; --grid:#E1E8E5; --line:#D3DCD9;
  --teal:#0E7470; --teal-ink:#FFFFFF; --teal-soft:#DCEFEC;
  --mark:#F2D94E; --mark-soft:#FBF1B8;
  --red:#B4233C; --red-soft:#F8E1E5;
  --code-bg:#1B2A41; --code-ink:#E7EDF5;
  --shadow:0 1px 0 rgba(27,42,65,.06), 0 8px 24px -16px rgba(27,42,65,.35);
  --f-head:"Schibsted Grotesk", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, monospace;
  --r-sm:6px; --r:12px; --r-lg:20px;
  --side:264px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#E6ECF3; --ink-2:#B3BFCF; --ink-3:#8796AB;
    --paper:#0F1724; --sheet:#162133; --grid:#1A2638; --line:#26354B;
    --teal:#3CC4BF; --teal-ink:#06201F; --teal-soft:#14353A;
    --mark:#F2D94E; --mark-soft:#3B3618;
    --red:#F07A8C; --red-soft:#3A1D26;
    --code-bg:#0B111C; --code-ink:#E7EDF5;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 28px -18px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#E6ECF3; --ink-2:#B3BFCF; --ink-3:#8796AB;
  --paper:#0F1724; --sheet:#162133; --grid:#1A2638; --line:#26354B;
  --teal:#3CC4BF; --teal-ink:#06201F; --teal-soft:#14353A;
  --mark:#F2D94E; --mark-soft:#3B3618;
  --red:#F07A8C; --red-soft:#3A1D26;
  --code-bg:#0B111C; --code-ink:#E7EDF5;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 28px -18px rgba(0,0,0,.8);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; font-family:var(--f-body); font-size:17px; line-height:1.55; color:var(--ink);
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:24px 24px;
}
h1,h2,h3,h4{font-family:var(--f-head); line-height:1.15; margin:0 0 .5em; letter-spacing:-.01em}
h1{font-size:clamp(1.9rem,1.4rem + 2vw,2.75rem); font-weight:800}
h2{font-size:1.5rem; font-weight:700}
h3{font-size:1.15rem; font-weight:700}
p{margin:0 0 1em}
a{color:var(--teal)}
code,pre,kbd{font-family:var(--f-mono); font-size:.88em}
:not(pre)>code{background:var(--teal-soft); padding:.1em .35em; border-radius:4px}
::selection{background:var(--mark); color:#1B2A41}
:focus-visible{outline:3px solid var(--mark); outline-offset:2px; border-radius:4px}
.skip{position:absolute; left:-999px; top:8px; background:var(--sheet); padding:8px 12px; z-index:100}
.skip:focus{left:8px}
.muted{color:var(--ink-3)}
.small{font-size:.9rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.num-font,input[type=number],input[type=date],.metric b,.range-row output,table.data td.num,.hero-chart .readout b,.chart text,.hero-chart output{font-family:var(--f-head)}
table.data td.num{font-variant-numeric:tabular-nums}
/* ---------- Top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:30; height:60px; display:flex; align-items:center; gap:12px;
  padding:0 20px; background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink); font-family:var(--f-head); font-weight:800; font-size:1.05rem}
.brand-mark{width:30px; height:30px}
.brand-mark rect{fill:var(--ink)} .brand-mark path{fill:none; stroke:var(--mark); stroke-width:3; stroke-linecap:round}
:root[data-theme="dark"] .brand-mark rect{fill:#26354B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand-mark rect{fill:#26354B}}
.topbar-actions{margin-left:auto; display:flex; align-items:center; gap:10px}
.icon-btn{display:inline-grid; place-items:center; width:40px; height:40px; border:1px solid var(--line); background:var(--sheet); color:var(--ink); border-radius:10px; cursor:pointer}
.icon-btn:hover{border-color:var(--ink-3)}
.menu-btn{display:none}
.role-switch{display:inline-flex; border:1px solid var(--line); border-radius:999px; padding:3px; background:var(--sheet)}
.role-switch button{border:0; background:transparent; color:var(--ink-2); font:inherit; font-size:.88rem; padding:5px 12px; border-radius:999px; cursor:pointer}
.role-switch button[aria-pressed="true"]{background:var(--ink); color:var(--paper); font-weight:700}

/* ---------- Layout ---------- */
.layout{display:grid; grid-template-columns:var(--side) minmax(0,1fr); min-height:calc(100vh - 60px)}
.sidebar{
  position:sticky; top:60px; height:calc(100vh - 60px); overflow-y:auto;
  padding:20px 14px 32px; border-right:1px solid var(--line); background:color-mix(in srgb, var(--paper) 94%, var(--sheet));
}
.nav-group{margin-bottom:18px}
.sidebar>.nav-link:first-child{margin-bottom:14px}
.nav-group h2{font-size:.82rem; font-weight:700; color:var(--ink-3); margin:0 10px 6px; letter-spacing:.01em}
.nav-link{display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:8px; color:var(--ink-2); text-decoration:none; font-size:.97rem}
.nav-link svg{flex:none; width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.nav-link:hover{background:var(--sheet); color:var(--ink)}
.nav-link[aria-current="page"]{background:var(--sheet); color:var(--ink); font-weight:700; box-shadow:inset 3px 0 0 var(--teal)}
.nav-badge{margin-left:auto; font-size:.75rem; background:var(--mark); color:#1B2A41; border-radius:999px; padding:0 7px; font-weight:700}
.sidebar-foot{border-top:1px solid var(--line); margin-top:10px; padding:14px 10px 0; font-size:.85rem; color:var(--ink-3)}
.sidebar-foot button{margin-top:6px}
.scrim{display:none}

main{padding:36px clamp(16px,4vw,56px) 80px; outline:none; min-width:0}
main:focus,main:focus-visible{outline:none}
.page{max-width:1080px; margin:0 auto}
.page-head{margin-bottom:22px}
.page-head p{color:var(--ink-2); max-width:62ch; margin:0}

@media (max-width:900px){
  body{font-size:16px}
  .menu-btn{display:inline-grid}
  .layout{grid-template-columns:1fr}
  .sidebar{position:fixed; top:60px; left:0; bottom:0; width:min(86vw,300px); z-index:40; transform:translateX(-102%); transition:transform .22s ease; background:var(--paper); height:auto}
  .sidebar.open{transform:none; box-shadow:var(--shadow)}
  .scrim{display:block; position:fixed; inset:60px 0 0; background:rgba(15,23,36,.45); z-index:35}
  .scrim[hidden]{display:none}
  .brand span{font-size:.95rem}
  main{padding-top:24px}
}
@media (max-width:520px){
  .role-switch button{padding:5px 9px; font-size:.8rem}
  .brand span{display:none}
}

/* ---------- Tabs ---------- */
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:22px; overflow-x:auto; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none; border:0; background:transparent; font:inherit; color:var(--ink-2); padding:10px 14px; cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink); font-weight:700; border-bottom-color:var(--teal)}

/* ---------- Surfaces ---------- */
.sheet{background:var(--sheet); border:1px solid var(--line); border-radius:var(--r); padding:22px; box-shadow:var(--shadow)}
.sheet + .sheet{margin-top:16px}
.sheet.tight{padding:16px}
.sheet h2:first-child,.sheet h3:first-child{margin-top:0}
.grid{display:grid; gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-side{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
@media (max-width:820px){.g2,.g3,.g-side{grid-template-columns:minmax(0,1fr)}}
.grid>*{min-width:0}
.stack>*+*{margin-top:12px}
.row{display:flex; gap:12px; align-items:center; flex-wrap:wrap}
.spread{display:flex; gap:12px; align-items:flex-start; justify-content:space-between; flex-wrap:wrap}

/* ---------- Forms ---------- */
label.field{display:block; font-size:.92rem; font-weight:700; color:var(--ink-2)}
label.field>span.hint{font-weight:400; color:var(--ink-3)}
.field input,.field select,.field textarea{display:block; width:100%; margin-top:5px}
input[type=text],input[type=number],input[type=email],input[type=url],input[type=date],input[type=search],select,textarea{
  font:inherit; font-size:1rem; color:var(--ink); background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:9px 11px;
}
textarea{resize:vertical; min-height:90px}
textarea.code{font-family:var(--f-mono); font-size:.88rem}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal); outline-offset:0; border-color:transparent}
input[type=range]{width:100%; accent-color:var(--teal)}
input[type=checkbox],input[type=radio]{accent-color:var(--teal); width:18px; height:18px; flex:none}
.check{display:flex; gap:10px; align-items:flex-start; padding:6px 0; cursor:pointer}
.check input{margin-top:3px}
.check.done span{text-decoration:line-through; color:var(--ink-3)}
.form-grid{display:grid; gap:14px; grid-template-columns:repeat(2,minmax(0,1fr))}
.form-grid .full{grid-column:1/-1}
@media (max-width:640px){.form-grid{grid-template-columns:1fr}}
.range-row{display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center}
.range-row output{font-size:.95rem; font-weight:700; min-width:4ch; text-align:right}
.seg{display:inline-flex; flex-wrap:wrap; gap:6px}
.seg button{border:1px solid var(--line); background:var(--sheet); color:var(--ink-2); font:inherit; font-size:.92rem; padding:6px 12px; border-radius:999px; cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--ink); background:var(--ink); color:var(--paper)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; font:inherit; font-weight:700; font-size:.97rem; padding:10px 16px; border-radius:10px; border:1px solid var(--teal); background:var(--teal); color:var(--teal-ink); cursor:pointer; text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink-3); filter:none}
.btn.danger{background:transparent; color:var(--red); border-color:color-mix(in srgb,var(--red) 40%,transparent)}
.btn.sm{padding:6px 11px; font-size:.88rem; border-radius:8px}
.btn:disabled{opacity:.5; cursor:not-allowed}
.link-btn{border:0; background:none; color:var(--teal); font:inherit; padding:0; cursor:pointer; text-decoration:underline; text-underline-offset:3px}

/* ---------- Chips & meta ---------- */
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{display:inline-block; font-size:.8rem; padding:2px 9px; border-radius:999px; border:1px solid var(--line); color:var(--ink-2); background:var(--paper)}
.chip.lvl{border-color:transparent; background:var(--teal-soft); color:var(--ink)}
.chip.ok{background:var(--mark); color:#1B2A41; border-color:transparent; font-weight:700}
.chip.warn{background:var(--red-soft); color:var(--red); border-color:transparent}
.meta{display:flex; flex-wrap:wrap; gap:4px 14px; font-size:.88rem; color:var(--ink-3)}

/* ---------- Callouts ---------- */
.note{border-radius:10px; padding:12px 14px; background:var(--teal-soft); color:var(--ink); border-left:4px solid var(--teal)}
.note.good{background:var(--mark-soft); border-left-color:var(--mark)}
.note.bad{background:var(--red-soft); border-left-color:var(--red)}
.note p:last-child{margin-bottom:0}

/* ---------- Lists ---------- */
.list{list-style:none; margin:0; padding:0}
.list>li{padding:14px 0; border-top:1px solid var(--line)}
.list>li:first-child{border-top:0; padding-top:0}
.list>li:last-child{padding-bottom:0}
ul.plain{margin:0; padding-left:1.1em}
ul.plain li{margin:.25em 0}
details.fold{border:1px solid var(--line); border-radius:10px; background:var(--sheet)}
details.fold+details.fold{margin-top:10px}
details.fold>summary{cursor:pointer; padding:12px 16px; font-weight:700; list-style:none; display:flex; gap:10px; align-items:center}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:""; width:8px; height:8px; border-right:2px solid var(--ink-3); border-bottom:2px solid var(--ink-3); transform:rotate(-45deg); transition:transform .15s; flex:none}
details.fold[open]>summary::before{transform:rotate(45deg)}
details.fold>.fold-body{padding:0 16px 16px}

/* ---------- Metrics ---------- */
.metrics{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px}
.metric{background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:12px 14px}
.metric b{display:block; font-family:var(--f-head); font-size:1.5rem; line-height:1.1}
.metric span{font-size:.85rem; color:var(--ink-3)}
.bar{height:8px; background:var(--grid); border-radius:999px; overflow:hidden}
.bar>i{display:block; height:100%; background:var(--teal); border-radius:999px}

/* ---------- Code ---------- */
.code-wrap{position:relative}
pre.code{margin:0; background:var(--code-bg); color:var(--code-ink); padding:16px 18px; border-radius:10px; overflow-x:auto; line-height:1.5; font-size:.85rem; tab-size:4}
.code-wrap .copy{position:absolute; top:8px; right:8px; font:inherit; font-size:.78rem; background:rgba(255,255,255,.1); color:var(--code-ink); border:1px solid rgba(255,255,255,.2); border-radius:6px; padding:3px 9px; cursor:pointer}
.code-wrap .copy:hover{background:rgba(255,255,255,.2)}
.tok-c{color:#8FA3BF; font-style:italic}.tok-s{color:#F2D94E}.tok-k{color:#7FDCD6}.tok-n{color:#F5A97F}

/* ---------- Tables ---------- */
.table-wrap{overflow:auto; border:1px solid var(--line); border-radius:10px; max-height:420px}
table.data{border-collapse:collapse; width:100%; font-size:.88rem; background:var(--sheet)}
table.data th,table.data td{padding:7px 12px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap}
table.data th{position:sticky; top:0; background:var(--paper); font-family:var(--f-head); font-weight:700}
table.data td.num{text-align:right; font-variant-numeric:tabular-nums}

/* ---------- Charts ---------- */
.chart{width:100%; height:auto; display:block}
.chart .axis{stroke:var(--ink-3); stroke-width:1}
.chart .gridl{stroke:var(--grid); stroke-width:1}
.chart .tick{fill:var(--ink-3); font:500 12px var(--f-head)}
.chart .curve{fill:none; stroke:var(--teal); stroke-width:2.5}
.chart .area{fill:var(--teal); opacity:.14}
.chart .shade{fill:var(--mark); opacity:.75}
.chart .barp{fill:var(--teal)}
.chart .barp.hl{fill:var(--mark)}
.chart .crit{stroke:var(--red); stroke-width:1.5; stroke-dasharray:4 4}
.chart .stat{stroke:var(--ink); stroke-width:2}
.chart .lbl{fill:var(--ink); font:700 12px var(--f-head)}

/* ---------- Home ---------- */
.hero{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.15fr); gap:32px; align-items:center; margin-bottom:36px}
.hero h1{font-size:clamp(2.1rem,1.5rem + 2.6vw,3.3rem); max-width:13ch}
.hero .lede{font-size:1.1rem; color:var(--ink-2); max-width:44ch}
.hero-chart{background:var(--sheet); border:1px solid var(--line); border-radius:var(--r-lg); padding:18px 18px 14px; box-shadow:var(--shadow)}
.hero-chart .readout{display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:6px}
.hero-chart .readout b{font-family:var(--f-head); font-size:2rem}
.hero-chart .controls{display:grid; grid-template-columns:1fr 1fr; gap:6px 18px; margin-top:8px; font-size:.9rem}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.resume{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-bottom:40px}
.resume a{display:block; text-decoration:none; color:inherit; background:var(--sheet); border:1px solid var(--line); border-radius:var(--r); padding:16px 18px}
.resume a:hover{border-color:var(--ink-3)}
.resume b{display:block; font-family:var(--f-head); font-size:1.05rem}
.resume span{color:var(--ink-3); font-size:.92rem}
.directory{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:28px 32px}
.directory h2{font-size:1.1rem; padding-bottom:8px; border-bottom:2px solid var(--ink); margin-bottom:4px}
.directory ul{list-style:none; margin:0; padding:0}
.directory li a{display:block; padding:10px 0; border-bottom:1px solid var(--line); text-decoration:none; color:inherit}
.directory li a b{display:block; color:var(--ink)}
.directory li a span{font-size:.9rem; color:var(--ink-3)}
.directory li a:hover b{color:var(--teal)}

/* ---------- Flashcard ---------- */
.card-stage{background:var(--sheet); border:1px solid var(--line); border-radius:var(--r-lg); padding:28px; min-height:260px; display:flex; flex-direction:column; box-shadow:var(--shadow);
  background-image:linear-gradient(transparent 31px, var(--grid) 32px); background-size:100% 32px}
.card-stage .q{font-family:var(--f-head); font-size:1.45rem; font-weight:700; margin:10px 0 18px}
.card-stage .a{background:var(--mark-soft); border-radius:8px; padding:12px 14px; font-size:1.05rem}
.rate{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:auto; padding-top:18px}

/* ---------- Quiz ---------- */
.opts{display:grid; gap:8px; margin:10px 0}
.opt{display:flex; gap:10px; align-items:center; border:1px solid var(--line); border-radius:8px; padding:9px 12px; cursor:pointer; background:var(--paper)}
.opt:has(input:checked){border-color:var(--teal)}
.opt.right{background:var(--mark-soft); border-color:var(--mark)}
.opt.wrong{background:var(--red-soft); border-color:var(--red)}

/* ---------- Misc ---------- */
.empty{text-align:center; padding:36px 16px; color:var(--ink-2)}
.empty b{display:block; font-family:var(--f-head); font-size:1.15rem; color:var(--ink); margin-bottom:4px}
.toast{position:fixed; left:50%; bottom:22px; transform:translate(-50%,20px); background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:10px; font-size:.95rem; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:60; max-width:calc(100vw - 32px)}
.toast.show{opacity:1; transform:translate(-50%,0)}
.katex{font-size:1.05em}
.formula{padding:10px 0; border-top:1px solid var(--line)}
.formula:first-of-type{border-top:0}
.formula h4{font-family:var(--f-body); font-size:.92rem; color:var(--ink-2); margin:0 0 4px}
.formula .katex-display{margin:.2em 0; overflow-x:auto; overflow-y:hidden}
.reply{border-left:3px solid var(--line); padding:4px 0 4px 14px; margin-top:12px}
.avatar{display:inline-grid; place-items:center; width:28px; height:28px; border-radius:50%; background:var(--teal-soft); font-weight:700; font-size:.8rem; flex:none}
.photo{width:96px; height:96px; border-radius:50%; object-fit:cover; border:1px solid var(--line)}
hr.sep{border:0; border-top:1px solid var(--line); margin:22px 0}

@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
@media print{.topbar,.sidebar{display:none}.layout{display:block}body{background:#fff}}

</style>
</head>
<body>
<a class="skip" href="#main">Aller au contenu</a>

<header class="topbar">
  <button class="icon-btn menu-btn" id="menuBtn" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="sidebar">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>

<script>

   UCO Data Science Hub — application monopage (sans serveur)
   ---------------------------------------------------------------------
   Stockage : tout passe par l'objet `Store` ci-dessous. Il utilise
   aujourd'hui le localStorage du navigateur. Pour brancher une base en
   ligne (Supabase, Firebase…), il suffit de réécrire ces méthodes :
   elles renvoient déjà des Promises, le reste du code n'a pas à changer.
   ===================================================================== */

const Store = (() => {
  const KEY = "udsh:v1";
  let db;
  const load = () => {
    if (db) return db;
    try { db = JSON.parse(localStorage.getItem(KEY)) || {}; } catch { db = {}; }
    db.collections ||= {}; db.docs ||= {};
    return db;
  };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { toast("Impossible d'enregistrer : le stockage du navigateur est plein ou bloqué."); } };
  const col = (name) => (load().collections[name] ||= []);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  return {
    async list(name) { return col(name).map(x => ({ ...x })); },
    async get(name, id) { const x = col(name).find(r => r.id === id); return x ? { ...x } : null; },
    async add(name, obj) { const rec = { id: uid(), created_at: new Date().toISOString(), ...obj }; col(name).push(rec); save(); return { ...rec }; },
    async update(name, id, patch) { const r = col(name).find(x => x.id === id); if (!r) return null; Object.assign(r, patch, { updated_at: new Date().toISOString() }); save(); return { ...r }; },
    async remove(name, id) { const c = col(name); const i = c.findIndex(x => x.id === id); if (i >= 0) { c.splice(i, 1); save(); } },
    async getDoc(key, fallback) { const v = load().docs[key]; return v === undefined ? structuredClone(fallback) : structuredClone(v); },
    async setDoc(key, value) { load().docs[key] = value; save(); },
    async exportAll() { return JSON.stringify(load(), null, 2); },
    async importAll(json) { const d = JSON.parse(json); if (!d || typeof d !== "object" || !d.collections) throw new Error("Fichier non reconnu"); db = d; save(); },
    async clear() { db = { collections: {}, docs: {} }; save(); },
  };
})();

/* Générateur pseudo-aléatoire reproductible (mulberry32) */
function rng(seed = 42) {
  let a = seed >>> 0;
  const r = () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  r.int = (lo, hi) => lo + Math.floor(r() * (hi - lo + 1));
  r.uni = (lo, hi) => lo + r() * (hi - lo);
  r.pick = (arr, w) => { if (!w) return arr[Math.floor(r() * arr.length)]; let u = r(), s = 0; for (let i = 0; i < arr.length; i++) { s += w[i]; if (u < s) return arr[i]; } return arr[arr.length - 1]; };
  r.norm = (mu = 0, sd = 1) => { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return mu + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  r.exp = (mean) => -Math.log(1 - r()) * mean;
  return r;
}

/* Petit surligneur de code (Python / SQL), volontairement minimal */
function highlight(code, lang = "python") {
  const kw = lang === "sql"

  const out = []; const re = lang === "sql" ? /(--[^\n]*)|('(?:[^'\\]|\\.)*')/g : /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')/g;
  let last = 0, m;
  const plain = (s) => esc(s).replace(kw, '<span class="tok-k">$&</span>').replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="tok-n">$1</span>');
  while ((m = re.exec(code))) { out.push(plain(code.slice(last, m.index))); out.push(m[1] ? `<span class="tok-c">${esc(m[1])}</span>` : `<span class="tok-s">${esc(m[2])}</span>`); last = re.lastIndex; }
  out.push(plain(code.slice(last)));
  return out.join("");
}

function niceTicks(min, max, count = 6) {
  const span = max - min || 1, raw = span / count, mag = 10 ** Math.floor(Math.log10(raw)), norm = raw / mag;
  const step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
  const out = []; for (let v = Math.ceil(min / step) * step; v <= max + step * 1e-9; v += step) out.push(+v.toFixed(10));
  return { ticks: out, step };
}

function chart({ xs, ys, discrete = false, shade = null, hl = null, lines = [], height = 300, label = "" }) {

  const yt = niceTicks(0, Math.max(...ys.filter(Number.isFinite)) * 1.08 || 1, 4), ymax = yt.ticks.at(-1) || 1;
  const X = (v) => L + (v - x0) / (x1 - x0 || 1) * (W - L - R);
  const Y = (v) => T + (1 - v / ymax) * (H - T - B);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">`;
  for (const v of yt.ticks) s += `<line class="gridl" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="tick" x="${L - 8}" y="${Y(v) + 4}" text-anchor="end">${tickFmt(v, yt.step)}</text>`;
  const xt = niceTicks(xmin, xmax, discrete ? Math.min(10, xmax - xmin || 1) : 8);
  for (const v of xt.ticks) { if (discrete && v % 1) continue; s += `<text class="tick" x="${X(v)}" y="${H - 12}" text-anchor="middle">${tickFmt(v, Math.max(xt.step, discrete ? 1 : 0))}</text>`; }
  s += `<line class="axis" x1="${L}" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  if (discrete) {
    const bw = Math.max(1.5, (W - L - R) / (x1 - x0) * 0.72);
    xs.forEach((x, i) => { const on = hl && hl(x); s += `<rect class="barp${on ? " hl" : ""}" x="${X(x) - bw / 2}" y="${Y(ys[i])}" width="${bw}" height="${Math.max(0, Y(0) - Y(ys[i]))}" rx="1.5"/>`; });
  } else {
    if (shade) {
      const pts = xs.map((x, i) => [x, ys[i]]).filter(([x]) => x >= shade[0] && x <= shade[1]);
      if (pts.length) s += `<path class="shade" d="M${X(pts[0][0])},${Y(0)} ${pts.map(([x, y]) => `L${X(x)},${Y(y)}`).join(" ")} L${X(pts.at(-1)[0])},${Y(0)} Z"/>`;
    }
    const d = xs.map((x, i) => `${i ? "L" : "M"}${X(x).toFixed(1)},${Y(ys[i]).toFixed(1)}`).join(" ");
    s += `<path class="area" d="${d} L${X(xmax)},${Y(0)} L${X(xmin)},${Y(0)} Z"/><path class="curve" d="${d}"/>`;
  }
  for (const ln of lines) {
    if (ln.x < x0 || ln.x > x1) continue;
    const isStat = ln.cls === "stat", tx = X(ln.x), right = tx > W - 90;
    s += `<line class="${ln.cls}" x1="${tx}" x2="${tx}" y1="${T}" y2="${Y(0)}"/>${ln.text ? `<text class="lbl" x="${tx + (right ? -5 : 5)}" y="${T + (isStat ? 30 : 12)}" text-anchor="${right ? "end" : "start"}">${esc(ln.text)}</text>` : ""}`;
  }

}

function nextReview(card, rating) {
  const streak = rating === "difficile" ? 0 : (card.streak || 0) + 1;
  const days = rating === "difficile" ? 1 : Math.round(INTERVALS[rating] * Math.pow(rating === "facile" ? 2 : 1.6, Math.max(0, streak - 1)));
  const d = new Date(); d.setDate(d.getDate() + days);
  return { difficulte: rating, streak, dernier_revu: new Date().toISOString(), next_review: d.toISOString().slice(0, 10), revisions: (card.revisions || 0) + 1 };
}

const DISTS = {
  "Normale": { params: [["mu", "Moyenne μ", -10, 10, 0.1, 0], ["sigma", "Écart-type σ", 0.1, 5, 0.1, 1]],
    build: ({ mu, sigma }) => { const xs = linspace(mu - 4 * sigma, mu + 4 * sigma); return { xs, ys: xs.map(x => jStat.normal.pdf(x, mu, sigma)) }; },
    tex: ({ mu, sigma }) => `X \\sim \\mathcal{N}(${mu},\\ ${sigma}^2)`, props: ({ mu, sigma }) => [["E[X]", fmt(mu)], ["Var(X)", fmt(sigma * sigma)], ["P(μ−σ < X < μ+σ)", "≈ 68,3 %"]] },
  "Binomiale": { discrete: true, params: [["n", "Nombre d'essais n", 1, 100, 1, 20], ["p", "Probabilité de succès p", 0, 1, 0.01, 0.5]],
    build: ({ n, p }) => { const xs = Array.from({ length: n + 1 }, (_, k) => k); return { xs, ys: xs.map(k => jStat.binomial.pdf(k, n, p)) }; },
    tex: ({ n, p }) => `X \\sim \\mathcal{B}(${n},\\ ${p})`, props: ({ n, p }) => [["E[X] = np", fmt(n * p)], ["Var(X) = np(1−p)", fmt(n * p * (1 - p))]] },
  "Poisson": { discrete: true, params: [["lambda", "Paramètre λ", 0.1, 20, 0.1, 5]],
    build: ({ lambda }) => { const xs = Array.from({ length: Math.max(8, Math.ceil(lambda * 3)) }, (_, k) => k); return { xs, ys: xs.map(k => jStat.poisson.pdf(k, lambda)) }; },
    tex: ({ lambda }) => `X \\sim \\mathcal{P}(${lambda})`, props: ({ lambda }) => [["E[X]", fmt(lambda)], ["Var(X)", fmt(lambda)]] },
  "Exponentielle": { params: [["lambda", "Paramètre λ", 0.1, 5, 0.1, 1]],
    build: ({ lambda }) => { const xs = linspace(0, 10 / lambda); return { xs, ys: xs.map(x => jStat.exponential.pdf(x, lambda)) }; },
    tex: ({ lambda }) => `X \\sim \\mathcal{E}(${lambda})`, props: ({ lambda }) => [["E[X] = 1/λ", fmt(1 / lambda)], ["Var(X) = 1/λ²", fmt(1 / lambda ** 2)]] },
  "Uniforme": { params: [["a", "Borne inférieure a", -10, 10, 0.1, 0], ["b", "Borne supérieure b", -9.9, 20, 0.1, 10]],
    build: ({ a, b }) => { if (b <= a) b = a + 0.1; const xs = linspace(a - 1, b + 1); return { xs, ys: xs.map(x => x >= a && x <= b ? 1 / (b - a) : 0) }; },
    tex: ({ a, b }) => `X \\sim \\mathcal{U}([${a},\\ ${b}])`, props: ({ a, b }) => [["E[X] = (a+b)/2", fmt((a + b) / 2)], ["Var(X) = (b−a)²/12", fmt((b - a) ** 2 / 12)]] },
  "Student (t)": { params: [["df", "Degrés de liberté", 1, 30, 1, 10]],
    build: ({ df }) => { const xs = linspace(-5, 5); return { xs, ys: xs.map(x => jStat.studentt.pdf(x, df)) }; },
    tex: ({ df }) => `T \\sim t(${df})`, props: ({ df }) => [["E[T]", df > 1 ? "0" : "non définie"], ["Var(T) = ν/(ν−2)", df > 2 ? fmt(df / (df - 2)) : "infinie"]] },
};

const alphaSel = (id) => `<label class="field">Seuil α<select id="${id}"><option>0.01</option><option selected>0.05</option><option>0.1</option></select></label>`;
const altSel = (id) => `<label class="field">Hypothèse alternative H₁<select id="${id}"><option value="two">bilatérale (μ ≠ μ₀)</option><option value="right">unilatérale droite (μ > μ₀)</option><option value="left">unilatérale gauche (μ < μ₀)</option></select></label>`;

function decision(reject, alpha) {
  return reject
    ? `<div class="note bad"><p><b>On rejette H₀ au seuil ${alpha}.</b> L'écart observé est statistiquement significatif.</p></div>`
    : `<div class="note good"><p><b>On ne rejette pas H₀ au seuil ${alpha}.</b> Les données ne permettent pas de conclure à une différence.</p></div>`;

function testZT(el, isT) {
  el.innerHTML = `<div class="grid g-side"><div class="sheet"><div id="tres"></div></div><div class="sheet stack">
    ${num("xb", "Moyenne de l'échantillon", 105)}${num("mu0", "Moyenne sous H₀ (μ₀)", 100)}${num("sd", isT ? "Écart-type de l'échantillon s" : "Écart-type de la population σ", 15, 'min="0.0001"')}${num("n", "Taille de l'échantillon n", isT ? 25 : 30, 'min="2" step="1"')}${alphaSel("al")}${altSel("alt")}</div></div>`;
  const calc = () => {
    const xb = +$("#xb").value, mu0 = +$("#mu0").value, sd = +$("#sd").value, n = Math.round(+$("#n").value), alpha = +$("#al").value, alt = $("#alt").value;
    if (!(sd > 0) || !(n >= 2)) { $("#tres").innerHTML = `<div class="note bad">Renseigne un écart-type positif et n ≥ 2.</div>`; return; }
    const df = n - 1, stat = (xb - mu0) / (sd / Math.sqrt(n));
    const cdf = (x) => isT ? jStat.studentt.cdf(x, df) : jStat.normal.cdf(x, 0, 1);
    const inv = (p) => isT ? jStat.studentt.inv(p, df) : jStat.normal.inv(p, 0, 1);
    let p, crit, reject;
    if (alt === "two") { p = 2 * (1 - cdf(Math.abs(stat))); crit = inv(1 - alpha / 2); reject = Math.abs(stat) > crit; }
    else if (alt === "right") { p = 1 - cdf(stat); crit = inv(1 - alpha); reject = stat > crit; }
    else { p = cdf(stat); crit = inv(alpha); reject = stat < crit; }
    const lim = Math.max(4, Math.abs(stat) + 0.8), xs = linspace(-lim, lim), ys = xs.map(x => isT ? jStat.studentt.pdf(x, df) : jStat.normal.pdf(x, 0, 1));
    const lines = alt === "two" ? [{ x: -crit, cls: "crit" }, { x: crit, cls: "crit", text: "seuil" }] : [{ x: crit, cls: "crit", text: "seuil" }];
    lines.push({ x: stat, cls: "stat", text: isT ? "t" : "Z" });
    $("#tres").innerHTML = `${chart({ xs, ys, lines, height: 240, label: "Distribution sous H₀ avec la statistique observée" })}
      <div class="metrics" style="margin:12px 0">
        <div class="metric"><b>${fmt4(stat)}</b><span>Statistique ${isT ? "t" : "Z"}</span></div>
        <div class="metric"><b>${p < 0.0001 ? "< 0,0001" : fmt4(p)}</b><span>p-value</span></div>
        <div class="metric"><b>${alt === "two" ? "± " : ""}${fmt4(Math.abs(alt === "two" ? crit : crit) * (alt === "left" ? -1 : 1) * (alt === "two" ? 1 : 1))}</b><span>Valeur critique</span></div>
        ${isT ? `<div class="metric"><b>${df}</b><span>Degrés de liberté</span></div>` : ""}
      </div>${decision(reject, alpha)}
      <p class="small muted" style="margin-top:10px">${tex(`${isT ? "t" : "Z"} = \\frac{\\bar{x} - \\mu_0}{${isT ? "s" : "\\sigma"}/\\sqrt{n}} = \\frac{${xb} - ${mu0}}{${sd}/\\sqrt{${n}}}`, false)}</p>`;
  };
  $$("input,select", el).forEach(i => i.addEventListener("input", calc)); calc();
}
const CALC = {
  "Test Z (moyenne)": (el) => testZT(el, false),

  "Intervalle de confiance": (el) => {

      <label class="field">Niveau de confiance<select id="cf"><option value="0.9">90 %</option><option value="0.95" selected>95 %</option><option value="0.99">99 %</option></select></label>
      <label class="check"><input type="checkbox" id="known" checked><span>Écart-type de la population connu (loi normale)</span></label></div></div>`;
    const calc = () => {
      const xb = +$("#xb").value, sd = +$("#sd").value, n = Math.round(+$("#n").value), cf = +$("#cf").value, known = $("#known").checked, a = 1 - cf;
      if (!(sd > 0) || !(n >= 2)) { $("#icres").innerHTML = `<div class="note bad">Renseigne un écart-type positif et n ≥ 2.</div>`; return; }
      const useZ = known || n >= 30, q = useZ ? jStat.normal.inv(1 - a / 2, 0, 1) : jStat.studentt.inv(1 - a / 2, n - 1), me = q * sd / Math.sqrt(n);
      $("#icres").innerHTML = `<h3>IC à ${Math.round(cf * 100)} %</h3><p style="font-family:var(--f-head);font-size:2rem;font-weight:800;margin:.2em 0">[${fmt(xb - me)} ; ${fmt(xb + me)}]</p>
        <div class="metrics"><div class="metric"><b>± ${fmt(me)}</b><span>Marge d'erreur</span></div><div class="metric"><b>${fmt(q, 3)}</b><span>Quantile ${useZ ? "z" : `t (${n - 1} ddl)`}</span></div></div>
        <p class="small muted" style="margin-top:12px">${useZ ? "Loi normale utilisée : σ connu ou n ≥ 30." : "Loi de Student utilisée : σ inconnu et n < 30."}</p>${tex(`IC = \\bar{x} \\pm ${useZ ? "z" : "t"}_{1-\\alpha/2} \\cdot \\frac{${known ? "\\sigma" : "s"}}{\\sqrt{n}}`)}`;
    };

  },
  "Test du Khi² (indépendance)": (el) => {
    el.innerHTML = `<div class="grid g-side"><div class="sheet" id="chires"></div><div class="sheet stack"><p class="small muted">Tableau de contingence observé (effectifs). Exemple : achat (oui/non) selon le canal.</p>
      <div class="row"><label class="field" style="flex:1">Lignes<input type="number" id="rows" value="2" min="2" max="5"></label><label class="field" style="flex:1">Colonnes<input type="number" id="cols" value="2" min="2" max="5"></label></div><div id="ctab"></div>${alphaSel("al")}</div></div>`;
    const seed = [[30, 10], [20, 40]];
    const buildTab = () => {
      const r = Math.min(5, Math.max(2, +$("#rows").value | 0)), c = Math.min(5, Math.max(2, +$("#cols").value | 0));
      $("#ctab").innerHTML = `<div class="table-wrap" style="max-height:none"><table class="data"><tbody>${Array.from({ length: r }, (_, i) => `<tr>${Array.from({ length: c }, (_, j) => `<td><input type="number" min="0" step="1" aria-label="Ligne ${i + 1}, colonne ${j + 1}" data-i="${i}" data-j="${j}" value="${seed[i]?.[j] ?? 10}" style="width:72px;padding:5px 7px"></td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      $$("#ctab input").forEach(x => x.addEventListener("input", calc)); calc();
    };
    const calc = () => {
      const cells = $$("#ctab input"), r = Math.max(...cells.map(x => +x.dataset.i)) + 1, c = Math.max(...cells.map(x => +x.dataset.j)) + 1;
      const O = Array.from({ length: r }, () => Array(c).fill(0)); cells.forEach(x => O[x.dataset.i][x.dataset.j] = Math.max(0, +x.value || 0));
      const rs = O.map(row => row.reduce((a, b) => a + b, 0)), cs = O[0].map((_, j) => O.reduce((a, row) => a + row[j], 0)), N = rs.reduce((a, b) => a + b, 0);
      if (!N || rs.includes(0) || cs.includes(0)) { $("#chires").innerHTML = `<div class="note bad">Chaque ligne et chaque colonne doit avoir au moins un effectif.</div>`; return; }
      let chi = 0, small = 0; O.forEach((row, i) => row.forEach((o, j) => { const e = rs[i] * cs[j] / N; if (e < 5) small++; chi += (o - e) ** 2 / e; }));
      const df = (r - 1) * (c - 1), p = 1 - jStat.chisquare.cdf(chi, df), alpha = +$("#al").value, crit = jStat.chisquare.inv(1 - alpha, df);
      const xs = linspace(0.01, Math.max(crit, chi) * 1.4 + 2), ys = xs.map(x => jStat.chisquare.pdf(x, df));
      $("#chires").innerHTML = `${chart({ xs, ys, lines: [{ x: crit, cls: "crit", text: "seuil" }, { x: chi, cls: "stat", text: "χ²" }], height: 220, label: "Loi du Khi² sous H₀" })}
        <div class="metrics" style="margin:12px 0"><div class="metric"><b>${fmt4(chi)}</b><span>Statistique χ²</span></div><div class="metric"><b>${p < 0.0001 ? "< 0,0001" : fmt4(p)}</b><span>p-value</span></div><div class="metric"><b>${df}</b><span>Degrés de liberté</span></div><div class="metric"><b>${fmt(crit, 3)}</b><span>Valeur critique</span></div></div>
        ${chi > crit ? `<div class="note bad"><p><b>On rejette H₀ au seuil ${alpha}</b> : les deux variables ne sont pas indépendantes.</p></div>` : `<div class="note good"><p><b>On ne rejette pas H₀ au seuil ${alpha}</b> : pas de lien significatif entre les variables.</p></div>`}
        ${small ? `<p class="small muted" style="margin-top:10px">Attention : ${small} effectif${small > 1 ? "s" : ""} théorique${small > 1 ? "s" : ""} inférieur${small > 1 ? "s" : ""} à 5, le test est moins fiable.</p>` : ""}`;
    };
    $("#rows").addEventListener("input", buildTab); $("#cols").addEventListener("input", buildTab); $("#al").addEventListener("input", calc); buildTab();
  },
  "Taille d'échantillon": (el) => {
    el.innerHTML = `<div class="grid g-side"><div class="sheet" id="nres"></div><div class="sheet stack">

      $("#nres").innerHTML = Number.isFinite(n) && E > 0 ? `<h3>Taille minimale</h3><p style="font-family:var(--f-head);font-size:2.4rem;font-weight:800;margin:.1em 0">${Math.ceil(n).toLocaleString("fr-FR")} <span style="font-size:1rem;font-weight:500">individus</span></p>${tex(f)}<p class="small muted">On arrondit toujours à l'entier supérieur.</p>` : `<div class="note bad">Renseigne une marge d'erreur positive.</div>`;

  ["Lois de probabilité", [["Loi normale", "f(x) = \\frac{1}{\\sigma\\sqrt{2\\pi}}\\, e^{-\\frac{(x-\\mu)^2}{2\\sigma^2}}"], ["Loi binomiale", "P(X=k) = \\binom{n}{k} p^k (1-p)^{n-k}"], ["Loi de Poisson", "P(X=k) = \\frac{\\lambda^k e^{-\\lambda}}{k!}"], ["Centrer-réduire", "Z = \\frac{X - \\mu}{\\sigma} \\sim \\mathcal{N}(0,1)"]]],

const NIVEAUX = ["Débutant", "Intermédiaire", "Avancé"];
function keywords(text) {
  const words = CONTENT.teacher_space.patterns.flatMap(p => (p.match(/\((.*)\)/)?.[1] || "").split("|")).filter(Boolean);
  const low = text.toLowerCase();
  return words.filter(w => new RegExp(`(^|[^\\p{L}])${w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}([^\\p{L}]|$)`, "u").test(low)).slice(0, 12);
}

}
async function profExercises(panel) {
  const courses = await Store.list("courses");
  if (!courses.length) { panel.innerHTML = `<div class="sheet">${emptyState("Publie d'abord un cours", "Les exercices sont rattachés à un chapitre.", `<a class="btn" href="#/espace-prof/publier">Publier un cours</a>`)}</div>`; return; }
  const draw = async () => {
    const exos = (await Store.list("exercises")).reverse();
    panel.innerHTML = `<div class="grid g-side"><div class="sheet"><h3>Exercices (${exos.length})</h3>${exos.length ? `<ul class="list">${exos.map(x => `<li data-id="${x.id}"><b>${esc(x.question)}</b><div class="meta"><span>${esc(courses.find(c => c.id === x.course_id)?.chapitre || "Cours supprimé")}</span><span>Bonne réponse : ${esc(x.options[x.correct])}</span></div><button class="link-btn small" data-rm>Supprimer</button></li>`).join("")}</ul>` : `<p class="muted">Aucun exercice pour l'instant.</p>`}</div>
      <form class="sheet stack" id="ef"><h3>Nouvel exercice (QCM)</h3><label class="field">Cours<select name="course_id">${courses.map(c => `<option value="${c.id}">${esc(c.chapitre)}</option>`).join("")}</select></label>
      <label class="field">Question<textarea name="question" rows="2" required></textarea></label>
      ${[0, 1, 2, 3].map(i => `<div class="row" style="gap:8px"><input type="radio" name="correct" value="${i}" ${i ? "" : "checked"} aria-label="Réponse ${i + 1} correcte"><input type="text" name="o${i}" placeholder="Réponse ${i + 1}${i < 2 ? "" : " (optionnel)"}" ${i < 2 ? "required" : ""} style="flex:1"></div>`).join("")}
      <p class="small muted" style="margin:0">Coche le bouton devant la bonne réponse.</p>
      <label class="field">Explication<textarea name="explication" rows="2"></textarea></label>
      <label class="field">Niveau<select name="niveau">${opts(["B1", "B2", "B3"])}</select></label><button class="btn">Ajouter l'exercice</button></form></div>`;
    $("#ef").addEventListener("submit", async (e) => {
      e.preventDefault(); const d = formData(e.target), raw = [d.o0, d.o1, d.o2, d.o3], correctText = raw[+d.correct];
      if (!correctText) return toast("La réponse cochée comme correcte est vide.");
      const options = raw.filter(Boolean);
      await Store.add("exercises", { course_id: d.course_id, question: d.question, options, correct: options.indexOf(correctText), explication: d.explication, niveau: d.niveau });
      toast("Exercice ajouté"); draw();
    });
  };
  panel.addEventListener("click", async (e) => { if (!e.target.closest("[data-rm]")) return; await Store.remove("exercises", e.target.closest("[data-id]").dataset.id); draw(); });
  draw();
}
async function profStats(panel) {
  const [courses, exos, posts] = await Promise.all([Store.list("courses"), Store.list("exercises"), Store.list("forum_posts")]);
  const byMat = {}; MATIERES.forEach(m => byMat[m] = { c: 0, e: 0 }); courses.forEach(c => { (byMat[c.matiere] ||= { c: 0, e: 0 }).c++; byMat[c.matiere].e += exos.filter(e => e.course_id === c.id).length; });
  const open = posts.filter(p => !p.resolu);
  panel.innerHTML = `<div class="metrics" style="margin-bottom:16px"><div class="metric"><b>${courses.length}</b><span>Cours publiés</span></div><div class="metric"><b>${exos.length}</b><span>Exercices</span></div><div class="metric"><b>${open.length}</b><span>Questions non résolues au forum</span></div></div>
    <div class="grid g2"><div class="sheet"><h3>Par matière</h3><div class="table-wrap" style="max-height:none"><table class="data"><thead><tr><th>Matière</th><th>Cours</th><th>Exercices</th></tr></thead><tbody>${Object.entries(byMat).map(([m, v]) => `<tr><td>${esc(m)}</td><td class="num">${v.c}</td><td class="num">${v.e}</td></tr>`).join("")}</tbody></table></div></div>
    <div class="sheet"><h3>Questions en attente</h3>${open.length ? `<ul class="list">${open.slice(-6).reverse().map(p => `<li><b>${esc(p.titre)}</b><div class="meta"><span>${esc(p.matiere)}</span><span>${dateFR(p.created_at)}</span></div></li>`).join("")}</ul><a class="btn sm ghost" href="#/forum/questions" style="margin-top:10px">Répondre sur le forum</a>` : `<p class="muted">Aucune question en attente.</p>`}</div></div>
    <p class="small muted" style="margin-top:14px">Les statistiques de progression des étudiants arriveront avec les comptes utilisateurs.</p>`;
}
tool({ id: "espace-prof", title: "Espace professeur", group: "Enseigner", icon: "teacher", short: "Publier des cours et des exercices",
  lede: "Dépose tes chapitres et tes QCM : ils apparaissent côté étudiants dans « Cours des profs ».",
  tabs: [{ id: "publier", label: "Publier un cours", render: profUpload }, { id: "cours", label: "Mes cours", render: profCourses }, { id: "exercices", label: "Exercices", render: profExercises }, { id: "stats", label: "Statistiques", render: profStats }] });

/* ---------------- Mes données ---------------- */
async function settings(body) {
  const json = await Store.exportAll(), kb = (new Blob([json]).size / 1024).toFixed(0);
  body.innerHTML = `<div class="grid g2"><div class="sheet"><h3>Où sont mes données ?</h3><p>Tout ce que tu crées (flashcards, projets, portfolio, forum…) est enregistré <b>dans ce navigateur, sur cet appareil</b>. Rien n'est envoyé sur Internet.</p><p class="small muted">Taille actuelle : ${kb} Ko. Si tu vides les données de navigation, elles seront perdues : pense à faire une sauvegarde.</p></div>
    <div class="sheet stack"><h3>Sauvegarde</h3><button class="btn" id="exp">Télécharger une sauvegarde</button><label class="field">Restaurer une sauvegarde<input type="file" id="imp" accept="application/json,.json"></label><p class="small muted">Utile aussi pour passer d'un ordinateur à un autre.</p></div></div>
    <div class="sheet" style="margin-top:16px"><h3>Tout effacer</h3><p class="small">Supprime définitivement toutes les données de l'application sur cet appareil.</p><button class="btn danger" id="clr">Effacer toutes mes données</button></div>`;
  $("#exp").addEventListener("click", async () => download(`uco-data-science-hub_sauvegarde_${today()}.json`, await Store.exportAll(), "application/json"));
  $("#imp").addEventListener("change", async (e) => { const f = e.target.files[0]; if (!f) return; try { await Store.importAll(await f.text()); toast("Sauvegarde restaurée"); route(); } catch { toast("Ce fichier n'est pas une sauvegarde valide."); } });
  $("#clr").addEventListener("click", async () => { if (!confirm("Effacer toutes tes données ? Cette action est définitive.")) return; await Store.clear(); toast("Données effacées"); route(); });
}
tool({ id: "reglages", title: "Mes données", group: "Réglages", icon: "settings", hidden: true, short: "", lede: "Sauvegarde, restaure ou efface ce que tu as créé dans l'application.", render: settings });

/* ---------------- Démarrage ---------------- */
route();

</script>
